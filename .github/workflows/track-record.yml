name: Track Record

on:
  # Disabled: Account A (prediction_sites) runs Track Record at the same clock; keep a single source.
  workflow_dispatch:

jobs:
  track-record:
    runs-on: ubuntu-latest
    steps:
      - name: Run Track Record
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" -L \
            "https://predixa.co.tz/cron/track-record.php?key=${{ secrets.CRON_KEY }}" \
            --max-time 120)
          echo "HTTP Status: $STATUS"
          if [ "$STATUS" != "200" ]; then
            echo "FAILED with status $STATUS"
            exit 1
          fi
