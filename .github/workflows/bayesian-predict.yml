name: Bayesian Predict

on:
  # Disabled: Account A (prediction_sites) runs Bayesian Predict at the same clock and chains Analyze Picks off it.
  workflow_dispatch:

jobs:
  bayesian-predict:
    runs-on: ubuntu-latest
    steps:
      - name: Run Bayesian Predict
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" -L \
            "https://predixa.co.tz/cron/bayesian_predict?key=${{ secrets.CRON_KEY }}" \
            --max-time 120)
          echo "HTTP Status: $STATUS"
          if [ "$STATUS" != "200" ]; then
            echo "FAILED with status $STATUS"
            exit 1
          fi
