name: Email Opt-In Requests

# Sends double-opt-in confirmation emails to subscribers who have not yet
# confirmed. Deterministic: this workflow ONLY ever runs `send_optin_requests.php`
# (the scheduled hour no longer decides the campaign - GitHub Actions delays
# schedule runs, so the old hour-based routing silently skipped this campaign).
#
#   06:15 UTC = 09:15 EAT  -> opt-in requests (mid-morning, before pick runs,
#                            so confirmation mail never competes with briefings).

on:
  schedule:
    - cron: '15 6 * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: 'dry = preview only (sends nothing)'
        required: true
        type: choice
        default: dry
        options:
          - dry
          - live
      cap:
        description: 'Max emails this run (leave blank for campaign default)'
        required: false
        type: string

concurrency:
  group: email-campaigns
  cancel-in-progress: false

env:
  SCHEDULED_MODE: live
  CAMPAIGN_BASE_URL: https://predixa.co.tz/cron

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Determine mode
        id: plan
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_MODE: ${{ inputs.mode }}
          INPUT_CAP: ${{ inputs.cap }}
          SCHEDULED_MODE: ${{ env.SCHEDULED_MODE }}
        run: |
          SCRIPT="send_optin_requests.php"
          MODE="$SCHEDULED_MODE"
          CAP=""
          if [ "$EVENT_NAME" != "schedule" ]; then
            MODE="$INPUT_MODE"
            CAP="$INPUT_CAP"
          fi
          if [ -z "$MODE" ]; then
            MODE="live"
          fi

          echo "script=$SCRIPT" >> "$GITHUB_OUTPUT"
          echo "mode=$MODE"     >> "$GITHUB_OUTPUT"
          echo "cap=$CAP"       >> "$GITHUB_OUTPUT"
          {
            echo "## Email opt-in request run"
            echo ""
            echo "| Field | Value |"
            echo "| --- | --- |"
            echo "| Trigger | \`$EVENT_NAME\` |"
            echo "| Campaign | \`optin_request\` |"
            echo "| Mode | \`$MODE\` |"
            if [ -n "$CAP" ]; then echo "| Cap override | $CAP |"; fi
            echo ""
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Run campaign
        env:
          SCRIPT: ${{ steps.plan.outputs.script }}
          MODE: ${{ steps.plan.outputs.mode }}
          CAP: ${{ steps.plan.outputs.cap }}
          CRON_KEY: ${{ secrets.CRON_KEY }}
        run: |
          if [ -z "$CRON_KEY" ]; then
            echo "::error::Repository secret CRON_KEY is not set."
            exit 1
          fi

          ARGS=""
          if [ "$MODE" != "live" ]; then
            ARGS="dry_run=1"
          fi
          if [ -n "$CAP" ]; then
            if [ -n "$ARGS" ]; then
              ARGS="${ARGS}&cap=${CAP}"
            else
              ARGS="cap=${CAP}"
            fi
          fi

          URL="${CAMPAIGN_BASE_URL}/${SCRIPT}"
          if [ -n "$ARGS" ]; then
            REQUEST="${URL}?${ARGS}"
          else
            REQUEST="${URL}"
          fi

          echo "Calling $REQUEST"
          HTTP_CODE=$(curl --silent --show-error --location \
            --max-time 2400 \
            --write-out '%{http_code}' \
            --output report.json \
            --header "X-CRON-KEY: $CRON_KEY" \
            "$REQUEST" || echo "000")

          echo "HTTP $HTTP_CODE"
          if [ "$HTTP_CODE" != "200" ]; then
            echo "::error::Opt-in endpoint returned HTTP $HTTP_CODE"
            cat report.json 2>/dev/null || true
            exit 1
          fi

          if [ "$MODE" != "live" ] && grep -q '"dry_run"[[:space:]]*:[[:space:]]*false' report.json; then
            echo "::error::Dry run requested but server reported dry_run=false - refusing to treat as preview."
            exit 1
          fi

          cat report.json

      - name: Summarise result
        if: always()
        run: |
          if [ -f report.json ]; then
            {
              echo "### Result"
              echo ""
              echo '```json'
              head -c 6000 report.json
              echo ""
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No report produced." >> "$GITHUB_STEP_SUMMARY"
          fi