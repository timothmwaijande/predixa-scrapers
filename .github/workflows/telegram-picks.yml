name: Telegram Picks Cron (Backup)

# Redundant Telegram publisher on the PUBLIC repo (unlimited Actions minutes,
# visible runs). Primary on-time publish is cron-job.org -> cron/morning_delivery.php
# at 10:00 UTC (13:00 EAT). This workflow only ever runs the idempotent publisher, so
# already-posted picks (telegram_send_log dedupe) are skipped - extra runs are harmless.

on:
  workflow_dispatch:
  schedule:
    # Backup slots (schedule events on this account land hours late, so these are
    # last-resort only - they cover matches still upcoming in the evening).
    - cron: '15 7,13,19 * * *'   # 07:15 / 13:15 / 19:15 UTC -> 10:15 / 16:15 / 22:15 EAT
  workflow_run:
    workflows: ["Bayesian Predict"]
    types: [completed]

jobs:
  telegram-picks:
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run == null || github.event.workflow_run.conclusion == 'success' }}
    steps:
      - name: Publish picks to Telegram
        env:
          TG_KEY: ${{ secrets.CRON_KEY }}
          TG_FALLBACK: pred_f3cc603ea4f0e1a6038171dba59f41b601c0f815d1c1d580
        run: |
          KEY="${TG_KEY:-$TG_FALLBACK}"
          HTTP=$(curl --silent --show-error --location \
            --max-time 240 \
            -A "Mozilla/5.0 (compatible; PREDIXA-Bot)" \
            -o report.json -w '%{http_code}' \
            "https://predixa.co.tz/cron/telegram_predictions?key=$KEY" || echo "000")
          echo "HTTP $HTTP"
          cat report.json
          if [ "$HTTP" != "200" ]; then
            echo "::error::Telegram publish failed (HTTP $HTTP)"
            exit 1
          fi