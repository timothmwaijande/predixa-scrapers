name: Collect Match Stats

on:
  schedule:
    - cron: '0 6 * * *'    # Morning: collect yesterday
    - cron: '0 18 * * *'   # Evening: retry yesterday
  workflow_dispatch:
    inputs:
      date:
        description: 'Date to collect (YYYY-MM-DD, default: yesterday)'
        required: false
        default: ''
        type: string
      mode:
        description: 'Collection mode'
        required: false
        default: 'sofascore'
        type: choice
        options:
          - sofascore
          - backfill

jobs:
  collect-stats:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install curl_cffi

      - name: Determine date
        id: date
        run: |
          if [ -n "${{ inputs.date }}" ]; then
            echo "target_date=${{ inputs.date }}" >> $GITHUB_OUTPUT
          else
            echo "target_date=$(date -u -d 'yesterday' +%Y-%m-%d)" >> $GITHUB_OUTPUT
          fi

      - name: Run Sofascore scraper
        run: |
          DATE="${{ steps.date.outputs.date }}"
          echo "Collecting stats for $DATE"
          python cron/scrape_sofascore_stats.py "$DATE" \
            --post "https://predixa.co.tz/cron/receive_sofascore_stats.php" \
            --key "${{ secrets.STATS_SECRET_KEY }}"
        continue-on-error: true

      - name: Also trigger backfill via PHP (if backfill mode)
        if: inputs.mode == 'backfill'
        run: |
          curl -s "https://predixa.co.tz/cron/run_stats.php?key=${{ secrets.STATS_SECRET_KEY }}&mode=backfill" || echo "Backfill trigger failed"
        continue-on-error: true
