name: Collect Match Stats

on:
  schedule:
    - cron: '0 6 * * *'    # Morning: collect yesterday
    - cron: '0 18 * * *'   # Evening: retry yesterday
  workflow_dispatch:
    inputs:
      date:
        description: 'Date to collect (YYYY-MM-DD, default: yesterday)'
        required: false
        default: ''
        type: string
      mode:
        description: 'Collection mode'
        required: false
        default: 'sofascore'
        type: choice
        options:
          - sofascore
          - espn
          - backfill

jobs:
  collect-stats:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install curl_cffi

      - name: Compute date
        run: |
          if [ -n "${{ inputs.date }}" ]; then
            echo "DATE=${{ inputs.date }}" >> "$GITHUB_ENV"
          else
            echo "DATE=$(python3 -c "from datetime import datetime, timedelta; print((datetime.utcnow() - timedelta(days=1)).strftime('%Y-%m-%d'))")" >> "$GITHUB_ENV"
          fi
          echo "Collecting stats for $DATE"

      - name: Run Sofascore scraper (primary)
        if: inputs.mode != 'espn'
        continue-on-error: true
        run: |
          python cron/scrape_sofascore_stats.py "$DATE" \
            --fresh \
            --post "https://predixa.co.tz/cron/receive_sofascore_stats.php" \
            --key "${{ secrets.STATS_SECRET_KEY }}" \
            || true

      - name: ESPN fallback (if Sofascore collected nothing)
        if: ${{ always() }}
        run: |
          if [ "${{ inputs.mode }}" = "espn" ]; then
            RUN=1
          else
            N=$(python3 -c "import json,sys; print(json.load(open(f'sofascore_stats_{sys.argv[1]}.json')).get('stats_collected',0))" "$DATE" 2>/dev/null || echo 0)
            echo "Sofascore collected: $N"
            if [ "$N" -gt 0 ]; then RUN=0; else RUN=1; fi
          fi
          if [ "$RUN" = "1" ]; then
            echo "Running ESPN scraper for $DATE"
            python cron/scrape_espn_stats.py "$DATE" \
              --post "https://predixa.co.tz/cron/receive_sofascore_stats.php" \
              --key "${{ secrets.STATS_SECRET_KEY }}"
          else
            echo "Sofascore already delivered data; skipping ESPN."
          fi

      - name: Also trigger backfill via PHP (if backfill mode)
        if: inputs.mode == 'backfill'
        run: |
          curl -s "https://predixa.co.tz/cron/run_stats.php?key=${{ secrets.STATS_SECRET_KEY }}&mode=backfill" || echo "Backfill trigger failed"
        continue-on-error: true